# The gate Job may read and update only the ConfigMap gate-state (created empty by the secrets script, not in Git; P9)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: gate-state-writer, namespace: platform}
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [gate-state]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: gate-state-writer, namespace: platform}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: gate-state-writer}
subjects:
- {kind: ServiceAccount, name: gate, namespace: gate-test-dev}
- {kind: ServiceAccount, name: gate, namespace: gate-test-prod}
