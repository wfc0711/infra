# In-cluster endpoints: S3 http://garage.platform.svc.cluster.local:3900 (clients: region garage, path-style);
# admin API :3903 for the setup Job only (plan P15)
apiVersion: v1
kind: Service
metadata: {name: garage}
spec:
  selector: {app: garage}
  ports:
  - {name: s3, port: 3900, targetPort: s3}
  - {name: admin, port: 3903, targetPort: admin}
