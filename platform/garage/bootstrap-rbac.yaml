# The setup Job may read and update only the Secret garage-platform-test-key (created empty by the secrets script)
apiVersion: v1
kind: ServiceAccount
metadata: {name: garage-bootstrap}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: garage-bootstrap}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [garage-platform-test-key]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: garage-bootstrap}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: garage-bootstrap}
subjects:
- {kind: ServiceAccount, name: garage-bootstrap, namespace: platform}
