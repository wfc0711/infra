apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- statefulset.yaml
- service.yaml
- bootstrap-rbac.yaml
- bootstrap-job.yaml
configMapGenerator:
- name: garage-config
  files: [garage.toml]
- name: garage-bootstrap-script
  files: [bootstrap.sh]
generatorOptions:
  disableNameSuffixHash: true
