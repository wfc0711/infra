apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: platform, namespace: argocd}
spec:
  project: platform
  source: {repoURL: https://github.com/wfc0711/infra.git, targetRevision: main, path: platform}
  destination: {server: https://kubernetes.default.svc, namespace: platform}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
