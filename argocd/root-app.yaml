# App-of-Apps root. Applied once by hand (Phase 1 step 1.7); everything else comes from argocd/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels: {mycompany.jp/ea-id: EA-0000, mycompany.jp/env: shared}
spec:
  project: default
  source:
    repoURL: https://github.com/wfc0711/infra.git
    targetRevision: main
    path: argocd/apps
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
